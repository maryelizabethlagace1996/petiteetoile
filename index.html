<script>
/* =========================================================
   CONSTANTES
   ========================================================= */
const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS_LONG = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DAY_LETTERS = ['L','M','M','J','V','S','D'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const ALL_DAYS = [0,1,2,3,4,5,6];
const WEEKDAYS = [0,1,2,3,4];
const DEMO_PASSWORD = 'Etoile2026';
const INACTIVITY_MS = 2 * 60 * 1000;   // STAR-39
const LOCKOUT_MS = 5 * 60 * 1000;      // STAR-39
/* Couleur de l'enfant (STAR-18/19) : limitée à l'anneau de l'avatar et à une teinte très légère */
const COLORS = { corail:'#FF8A7A', ciel:'#4FB6E8', menthe:'#3DBE8B', lavande:'#9B8CF2' };
const AVATARS = ['🦊','🐻','🐰','🐼','🦁','🐸','🐧','🦄','🐢','🐙','🦉','🐨'];
const ICONS = ['🪥','🛏️','👕','🥣','🎒','🌙','🛁','📚','🧦','🧸','🍽️','🐶','🪴','🧹','🎹','⚽','🤝','⭐'];
const MOMENTS = [['matin','☀️','Matin'],['apres','🌤️','Après-midi'],['soir','🌙','Soir']];
const EXPERIENCES = {
  simplifiee: { label:'Simplifiée', icon:'🧸', desc:'Pour l’enfant qui ne lit pas encore : seulement sa journée, en images et en icônes, sans texte.' },
  detaillee:  { label:'Détaillée',  icon:'📖', desc:'Pour l’enfant qui commence à lire : une image et un nom court, et la vue de la semaine.' },
};
const REWARDS = [
  { emoji:'🍿', label:'Soirée cinéma maison' }, { emoji:'🛝', label:'Sortie au parc' },
  { emoji:'🍕', label:'Choisir le souper' }, { emoji:'🎨', label:'Bricolage en famille' },
];

/* STAR-22 : bibliothèque illustrée — 30 éléments, 5 catégories, valeur d'étoiles proposée (1 à 3) */
const CATS = [
  { id:'matin', icon:'☀️', label:'Matin', type:'task', moment:'matin' },
  { id:'soir', icon:'🌙', label:'Soir', type:'task', moment:'soir' },
  { id:'maison', icon:'🏠', label:'Maison', type:'task', moment:'apres' },
  { id:'savoir', icon:'🤝', label:'Savoir-être', type:'behavior' },
  { id:'emotions', icon:'💛', label:'Émotions', type:'behavior' },
];
const LIB_RAW = [
  ['matin','🪥','Me brosser les dents',1,1],['matin','👕','M’habiller tout seul',2,1],['matin','🥣','Déjeuner à table',1,1],
  ['matin','💧','Me laver le visage',1,1],['matin','🛏️','Faire mon lit',1,0],['matin','🎒','Préparer mon sac d’école',2,0],
  ['soir','🌙','Mettre mon pyjama',1,1],['soir','🪥','Me brosser les dents le soir',1,1],['soir','🛁','Prendre mon bain',1,1],
  ['soir','📚','Lire 15 minutes',2,0],['soir','🧦','Mettre mon linge au panier',1,0],['soir','👚','Préparer mes vêtements pour demain',2,0],
  ['maison','🧸','Ranger mes jouets',1,1],['maison','🐶','Nourrir mon animal',1,1],['maison','🪴','Arroser les plantes',1,1],
  ['maison','🍽️','Mettre la table',2,0],['maison','🧹','Aider à balayer',2,0],['maison','🧺','Plier mes vêtements',3,0],
  ['savoir','🤝','J’ai partagé',1,1],['savoir','💬','Dire merci et s’il te plaît',1,1],['savoir','⏳','Attendre mon tour',1,1],
  ['savoir','👂','Écouter du premier coup',1,0],['savoir','🫶','Aider sans qu’on me le demande',2,0],['savoir','🌈','Consoler un ami',2,0],
  ['emotions','🎈','Je me suis calmé',2,1],['emotions','🤗','Demander un câlin quand je suis triste',1,1],['emotions','🙋','Demander de l’aide',1,1],
  ['emotions','🗣️','Dire ce que je ressens',1,0],['emotions','😌','Respirer avant de me fâcher',2,0],['emotions','💛','Dire une gentillesse',1,0],
];
const LIBRARY = LIB_RAW.map(([cat, emoji, name, stars, simple]) => {
  const c = CATS.find(x => x.id === cat);
  return { cat, emoji, name, stars, simple: !!simple, type: c.type, moment: c.moment || null };
});
const libByName = n => LIBRARY.find(l => l.name === n);

/* =========================================================
   DONNÉES DE DÉMO
   ========================================================= */
const E = (st, n) => ({ st, n });
function seed() {
  return {
    screen: 'welcome', week: 0, today: 2,
    currentKid: 'lea', viewDay: 2, weekView: 'day',
    family: 'Tremblay', parentCode: '4826',
    unlocked: false, onboarding: false, lastAct: Date.now(),
    pin: '', pinError: '', pinFails: 0, lockUntil: 0, pinTarget: 'parent', pinTargetOpts: {},
    codeMode: 'onboard', codeStep: 1, codeFirst: '', codeEntry: '', codeMsg: '',
    introIdx: 0, giveKid: 'lea', taskFilter: 'all', taskTab: 'task',
    celebrating: null, justLit: null, accountConsent: false,
    kids: [
      { id:'lea', name:'Léa', exp:'detaillee', avatar:'🦊', color:'corail', reward:{ emoji:'🍿', label:'Soirée cinéma maison' }, goalOverride:18, lifetimePast:124, sky:5, rewardWon:false, rewardSeen:false, unseen:[], weekMsg:null },
      { id:'noah', name:'Noah', exp:'simplifiee', avatar:'🐻', color:'ciel', reward:{ emoji:'🛝', label:'Sortie au parc avec papa' }, goalOverride:null, lifetimePast:58, sky:2, rewardWon:false, rewardSeen:false, unseen:[], weekMsg:null },
    ],
    items: [
      { id:'t1', type:'task', kids:['lea','noah'], name:'Me brosser les dents', emoji:'🪥', moment:'matin', days:ALL_DAYS.slice(), stars:1, active:true },
      { id:'t2', type:'task', kids:['lea'], name:'Faire mon lit', emoji:'🛏️', moment:'matin', days:WEEKDAYS.slice(), stars:1, active:true },
      { id:'t7', type:'task', kids:['noah'], name:'M’habiller tout seul', emoji:'👕', moment:'matin', days:WEEKDAYS.slice(), stars:1, active:true },
      { id:'t3', type:'task', kids:['lea'], name:'Préparer mon sac d’école', emoji:'🎒', moment:'apres', days:WEEKDAYS.slice(), stars:1, active:true },
      { id:'t6', type:'task', kids:['noah'], name:'Ranger mes jouets', emoji:'🧸', moment:'apres', days:ALL_DAYS.slice(), stars:1, active:true },
      { id:'t8', type:'task', kids:['lea'], name:'Nourrir Biscuit, notre chien', emoji:'🐶', moment:'apres', days:[5,6], stars:1, active:true },
      { id:'t4', type:'task', kids:['lea'], name:'Lire 15 minutes', emoji:'📚', moment:'soir', days:[0,2,4], stars:2, active:true },
      { id:'t5', type:'task', kids:['lea','noah'], name:'Mettre mon pyjama', emoji:'🌙', moment:'soir', days:ALL_DAYS.slice(), stars:1, active:true },
      { id:'b1', type:'behavior', kids:['lea','noah'], name:'J’ai partagé', emoji:'🤝', stars:1, active:true },
      { id:'b2', type:'behavior', kids:['lea'], name:'Je me suis calmé', emoji:'🎈', stars:2, active:true },
      { id:'b3', type:'behavior', kids:['lea'], name:'Aider sans qu’on me le demande', emoji:'🫶', stars:2, active:true },
      { id:'b4', type:'behavior', kids:['noah'], name:'Dire merci et s’il te plaît', emoji:'💬', stars:1, active:true },
    ],
    familyLib: [ { cat:'famille', emoji:'🐶', name:'Nourrir Biscuit, notre chien', stars:1, simple:true, type:'task', moment:'apres' } ],
    log: {
      lea:  { 0:{ t1:E('done',1), t2:E('done',1), t3:E('done',1), t4:E('done',2), t5:E('done',1) }, 1:{ t1:E('done',1), t2:E('done',1), t5:E('done',1) }, 2:{ t1:E('done',1), t2:E('pending',1) } },
      noah: { 0:{ t1:E('done',1), t7:E('done',1), t6:E('done',1) }, 1:{ t1:E('done',1), t5:E('done',1) }, 2:{ t1:E('done',1) } },
    },
    bonus: { lea:{ 0:[{ id:'b1', n:1 }] }, noah:{ 1:[{ id:'b4', n:1 }] } },
    pendingAt: { 'lea-2-t2':'il y a 12 min' },
    form: null, formErr: {}, draft: null, draftErr: {}, routineKid: null, routineDraft: null, forgotErr: false, accountErr: false,
  };
}
let state = seed();

/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const getKid = id => state.kids.find(k => k.id === id);
const getItem = id => state.items.find(i => i.id === id);
const uid = p => p + Math.random().toString(36).slice(2, 8);
const isSimple = k => k && k.exp === 'simplifiee';
const dateOf = d => new Date(2026, 8, 28 + 7 * state.week + d);
const fmtDate = d => { const x = dateOf(d); return (x.getDate() === 1 ? '1er' : x.getDate()) + ' ' + MONTHS[x.getMonth()]; };
const fullDate = d => DAYS_LONG[d] + ' ' + fmtDate(d);

/* Anti-appuis multiples (STAR-19, 28, 29, 30, 34) */
const lastTap = {};
function tapOk(key, ms = 700) { const n = Date.now(); if (lastTap[key] && n - lastTap[key] < ms) return false; lastTap[key] = n; return true; }

/* STAR-27 : une modification s'applique dès le lendemain */
function itemAt(it, day) { return (it.next && day >= it.nextFrom) ? { ...it, ...it.next } : it; }
function itemsFor(kid, day, type) {
  return state.items.filter(i => !i.deleted && i.active && i.type === type).map(i => itemAt(i, day))
    .filter(i => i.kids.includes(kid) && (type === 'behavior' || i.days.includes(day)));
}
function dayLog(kid, day) { state.log[kid] = state.log[kid] || {}; state.log[kid][day] = state.log[kid][day] || {}; return state.log[kid][day]; }
function dayBonus(kid, day) { state.bonus[kid] = state.bonus[kid] || {}; state.bonus[kid][day] = state.bonus[kid][day] || []; return state.bonus[kid][day]; }
const entry = (kid, day, id) => ((state.log[kid] || {})[day] || {})[id];

/* Étoiles mémorisées avec leur valeur : supprimer/modifier une tâche ne retire rien (STAR-27) */
function starsOn(kid, day, st = 'done') {
  let s = 0; const L = (state.log[kid] || {})[day] || {};
  for (const id in L) if (L[id].st === st) s += L[id].n;
  if (st === 'done') ((state.bonus[kid] || {})[day] || []).forEach(b => s += b.n);
  return s;
}
const weekStars = kid => ALL_DAYS.reduce((a, d) => a + starsOn(kid, d), 0);
const pendingStars = kid => ALL_DAYS.reduce((a, d) => a + starsOn(kid, d, 'pending'), 0);
const lifetime = k => k.lifetimePast + weekStars(k.id);
const behaviorCount = (kid, id, day) => (day == null ? ALL_DAYS : [day]).reduce((a, d) => a + ((state.bonus[kid] || {})[d] || []).filter(b => b.id === id).length, 0);
/* STAR-31 : objectif = 80 % des étoiles possibles, ajustable par le parent */
function possibleStars(kid) { let s = 0; ALL_DAYS.forEach(d => itemsFor(kid, d, 'task').forEach(i => s += i.stars)); return s; }
const autoGoal = kid => Math.max(1, Math.round(possibleStars(kid) * 0.8));
const goalOf = k => k.goalOverride != null ? k.goalOverride : autoGoal(k.id);
const unseenSum = k => k.unseen.reduce((a, u) => a + u.n, 0);

function checkGoal(kid) {
  const k = getKid(kid);
  if (k && !k.rewardWon && weekStars(kid) >= goalOf(k)) { k.rewardWon = true; k.rewardSeen = false; k.sky++; return true; }
  return false;
}
function pendingList() {
  const out = [];
  state.kids.forEach(k => ALL_DAYS.forEach(d => { const L = (state.log[k.id] || {})[d] || {}; for (const id in L) if (L[id].st === 'pending' && getItem(id)) out.push({ kid:k.id, day:d, id }); }));
  return out;
}
function namesList(ids) { const n = ids.map(id => getKid(id)?.name).filter(Boolean); return n.length <= 1 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' et ' + n[n.length - 1]; }
function tooSimple(c) { return /^(\d)\1{3}$/.test(c) || '0123456789'.includes(c) || '9876543210'.includes(c) || ['1212','2580','0852','1122','6969','1010','2020','1004','0007','2468','1357'].includes(c); }


/* =========================================================
   ÉLÉMENTS GRAPHIQUES
   ========================================================= */
function starPoints(cx, cy, R, r) {
  const p = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; p.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1)); }
  return p.join(' ');
}
function mascot(size = 120) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="${starPoints(50, 52, 48, 22)}" fill="#FFC93C" stroke="#F2B100" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="41" cy="50" rx="3.6" ry="4.6" fill="#1E1A4D"/><ellipse cx="59" cy="50" rx="3.6" ry="4.6" fill="#1E1A4D"/>
    <path d="M43 60 Q50 67 57 60" stroke="#1E1A4D" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
function starfield(n) {
  let s = '';
  for (let i = 0; i < n; i++) { const x = (i * 37 + 11) % 100, y = (i * 53 + 7) % 100, sz = 1 + (i % 2); s += `<span class="absolute rounded-full bg-white twinkle" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;animation-delay:${(i % 7) * .4}s"></span>`; }
  return `<div class="absolute inset-0 pointer-events-none overflow-hidden">${s}</div>`;
}
function avatarBubble(k, size = 'w-10 h-10 text-2xl') {
  const c = COLORS[k.color];
  return `<span class="${size} rounded-full inline-flex items-center justify-center shrink-0 bg-white" style="box-shadow:inset 0 0 0 4px ${c}">${k.avatar}</span>`;
}
/* STAR-31 : constellation — les nouvelles étoiles s'allument à la fin de la célébration */
function constellation(k) {
  const g = goalOf(k), total = weekStars(k.id), hidden = unseenSum(k);
  const lit = Math.min(Math.max(0, total - hidden), g), pend = pendingStars(k.id), complete = lit >= g;
  const W = 310, H = 104, R = g > 20 ? 6.5 : g > 12 ? 8 : 10;
  const pts = Array.from({ length: g }, (_, i) => [g === 1 ? W / 2 : 14 + i * ((W - 28) / (g - 1)), 52 + 30 * Math.sin(i * 1.25) + 8 * Math.cos(i * 2.6)]);
  const jl = state.justLit && state.justLit.kid === k.id ? state.justLit : null;
  let lines = '', stars = '';
  for (let i = 0; i < g - 1; i++) {
    const on = i + 1 < lit;
    lines += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i + 1][0]}" y2="${pts[i + 1][1]}" stroke="${on ? '#FFC93C' : 'rgba(255,255,255,.16)'}" stroke-width="${on ? 2 : 1.2}" ${on ? '' : 'stroke-dasharray="3 4"'} ${complete ? 'class="alive"' : ''}/>`;
  }
  pts.forEach(([x, y], i) => {
    if (i < lit) {

    else stars += `<circle cx="${x}" cy="${y}" r="2.6" fill="rgba(255,255,255,.35)"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-[104px]" role="img" aria-label="Constellation : ${lit} étoiles sur ${g}">${lines}${stars}</svg>`;

SCREENS.pin = () => {
  const locked = state.lockUntil > Date.now();
  const rem = Math.ceil((state.lockUntil - Date.now()) / 1000), mm = Math.floor(rem / 60), ss = String(rem % 60).padStart(2, '0');
  return `
  <div class="absolute inset-0 bg-primary-900 text-white">
    <div class="h-full flex flex-col items-center px-8 pt-14 pb-10">

        : `<p class="text-primary-100 text-sm mt-2">Entrez votre code à 4 chiffres</p>
      <div class="mt-8">${pinDots(state.pin.length, state.pinError)}</div>
      <p class="h-5 mt-4 text-sm font-bold text-rose-300">${state.pinError}</p>

};
function pinPress(n) {
  if (state.lockUntil > Date.now()) return;
  if (n === 'del') { state.pin = state.pin.slice(0, -1); render(); return; }
  if (state.pin.length >= 4) return;
  state.pin += n; state.pinError = ''; render();
  if (state.pin.length < 4) return;
  setTimeout(() => {
    if (state.pin === state.parentCode) {
      state.pin = ''; state.pinFails = 0; state.unlocked = true; state.lastAct = Date.now();
      go(state.pinTarget, state.pinTargetOpts);
    } else {
      state.pin = ''; state.pinFails++;
      if (state.pinFails >= 5) { state.lockUntil = Date.now() + LOCKOUT_MS; state.pinFails = 0; state.pinError = ''; }
      else state.pinError = `Code incorrect · ${5 - state.pinFails} essai${5 - state.pinFails > 1 ? 's' : ''} restant${5 - state.pinFails > 1 ? 's' : ''}`;
      render();
    }
  }, 200);
}

let overlayTimer, overlayClosing = false, overlayOnClose = null;
function confetti(n = 20) { let s = ''; for (let i = 0; i < n; i++) s += `<span class="confetti" style="left:${Math.random() * 100}%;font-size:${14 + Math.random() * 14}px;animation-duration:${1.6 + Math.random() * 1.2}s;animation-delay:${Math.random() * .4}s">⭐</span>`; return s; }
function openOverlay(html, onClose, autoMs) {
  const o = $('overlay'); clearTimeout(overlayTimer);
  overlayClosing = false; overlayOnClose = onClose; o.innerHTML = html; o.classList.remove('hidden');
  if (window.lucide) lucide.createIcons();
  if (autoMs) overlayTimer = setTimeout(closeOverlay, autoMs);
}
function closeOverlay() {
  if (overlayClosing || !overlayOpen()) return; overlayClosing = true; clearTimeout(overlayTimer);
  $('overlay').classList.add('hidden'); $('overlay').innerHTML = '';
  const cb = overlayOnClose; overlayOnClose = null; if (cb) cb();
}
const overlayOpen = () => !$('overlay').classList.contains('hidden');

/* Plusieurs étoiles reçues en son absence → une seule animation, ≤ 3 s, interruptible */
function celebrateReceived(k) {
  const n = unseenSum(k), emojis = k.unseen.map(u => u.emoji).slice(0, 5).join(' '), simple = isSimple(k);
  const msgs = ['Tu brilles comme une étoile !', 'Bravo, continue comme ça !', 'Quelle belle étoile !', 'Je suis fier de toi !'];
  const msg = msgs[(weekStars(k.id) + n) % msgs.length];
  state.celebrating = k.id;
  openOverlay(`
    <div onclick="closeOverlay()" class="absolute inset-0 bg-primary-900/95 flex flex-col items-center justify-center text-white px-8 text-center overflow-hidden cursor-pointer" role="dialog" aria-label="Bravo ${k.name}, +${n} étoiles">
      ${confetti()}
      <div class="pop">${mascot(simple ? 170 : 130)}</div>
      ${simple ? '' : `<p class="font-display text-4xl mt-6 pop">Bravo ${k.name} !</p><p class="kid-txt text-primary-100 mt-3">${msg}</p>`}
      <p class="text-4xl mt-6">${emojis}</p>
      <div class="mt-6 fly-up flex flex-wrap justify-center gap-1 max-w-[240px]">${Array.from({ length: Math.min(n, 10) }, () => '<span class="text-5xl">⭐</span>').join('')}</div>
    </div>`, () => {
      const total = weekStars(k.id), before = Math.max(0, total - n), g = goalOf(k);
      k.unseen = []; state.celebrating = null;
      state.justLit = { kid:k.id, from:Math.min(before, g), to:Math.min(total, g) };
      render(); setTimeout(() => { state.justLit = null; }, 50);
    }, 2900);
}
function rewardOverlay(k) {
  const simple = isSimple(k); k.rewardSeen = true;
  openOverlay(`
    <div class="absolute inset-0 bg-primary-900 flex flex-col items-center justify-center text-white px-8 text-center overflow-hidden">

function maybeOverlay() {
  if (state.screen !== 'week' || overlayOpen()) return;

const PARENT = ['parent','give','kids','tasks','form','create','routine'];
const CHILD = ['home','week'];
const DARK = ['welcome','intro','week','pin','setcode','forgot'];
function go(screen, opts = {}) {
  if (PARENT.includes(screen) && !state.unlocked && !(state.onboarding && ['create','routine'].includes(screen))) {
    state.pinTarget = screen; state.pinTargetOpts = opts; state.pin = ''; state.pinError = ''; screen = 'pin';
  }
  if (CHILD.includes(screen)) {
    if (state.unlocked) { state.unlocked = false; setTimeout(() => toast('🔒 Espace parent verrouillé'), 50); }
    state.onboarding = false;
  }
  if (opts.kid) { state.currentKid = opts.kid; state.viewDay = state.today; state.weekView = 'day'; }
  if (screen === 'form' && !opts.keepForm) { state.form = newForm(); state.formErr = {}; }
  if (screen === 'create') { state.draft = newDraft(); state.draftErr = {}; }
  if (screen === 'account') { state.accountErr = false; }
  if (screen !== 'home') state.highlightKid = null;
  closeOverlay();
  state.screen = screen;
  render(true);
}
function render(fresh) {
  const host = $('screens');
  const prev = host.querySelector('.scroll');
  const top = !fresh && prev ? prev.scrollTop : 0;
  host.innerHTML = `<section class="absolute inset-0" data-screen="${state.screen}">${SCREENS[state.screen]()}</section>`;
  const sc = host.querySelector('.scroll'); if (sc) sc.scrollTop = top;
  bindSwipe();
  const dark = DARK.includes(state.screen);
  $('statusbar').classList.toggle('text-white', dark); $('statusbar').classList.toggle('text-ink', !dark);
  $('homeIndicator').classList.toggle('bg-white', dark); $('homeIndicator').classList.toggle('bg-ink', !dark);
  renderPanel();
  if (window.lucide) lucide.createIcons();
  if (state.screen === 'week') maybeOverlay();
}
/* Glissement court pour changer de jour (STAR-32) ou d'écran de présentation */
function bindSwipe() {
  const el = $('daySwipe') || $('introSwipe'); if (!el) return;
  let x0 = null;
  el.addEventListener('pointerdown', e => { x0 = e.clientX; });
  el.addEventListener('pointerup', e => {
    if (x0 == null) return; const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) < 60) return;
    if (state.screen === 'intro') { const n = state.introIdx + (dx < 0 ? 1 : -1); if (n >= 0 && n < INTRO.length) { state.introIdx = n; render(); } }
    else if (state.weekView === 'day' && !isSimple(getKid(state.currentKid))) setDay(state.viewDay + (dx < 0 ? 1 : -1));
  });
}
/* Verrouillage auto après 2 min d'inactivité + minuteur de blocage */
$('phone').addEventListener('pointerdown', () => { state.lastAct = Date.now(); }, true);
$('phone').addEventListener('keydown', () => { state.lastAct = Date.now(); }, true);
setInterval(() => {
  if (state.unlocked && Date.now() - state.lastAct > INACTIVITY_MS) { go('home'); setTimeout(() => toast('🔒 Espace parent verrouillé (2 min d’inactivité)'), 80); }
  if (state.screen === 'pin' && state.lockUntil) {
    if (state.lockUntil <= Date.now()) { state.lockUntil = 0; render(); }
    else if ($('lockTimer')) { const r = Math.ceil((state.lockUntil - Date.now()) / 1000); $('lockTimer').textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); }
  }
  updateLockStatus();
}, 1000);
function updateLockStatus() {
  const el = $('lockStatus'); if (!el) return;
  if (state.unlocked) { const r = Math.max(0, Math.ceil((INACTIVITY_MS - (Date.now() - state.lastAct)) / 1000)); el.innerHTML = `<span class="text-white">🔓 Espace parent ouvert</span> <span class="text-slate-400">· verrouillage auto dans ${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}</span>`; }
  else if (state.lockUntil > Date.now()) el.innerHTML = '<span class="text-rose-300">⛔ Accès parent bloqué (5 codes erronés)</span>';
  else el.innerHTML = '<span class="text-slate-300">🔒 Espace parent verrouillé · l’app s’ouvre en mode enfant</span>';
}

/* =========================================================
   PANNEAU PRÉSENTATEUR (2 colonnes compactes)
   ========================================================= */
const PANEL = [
  { epic:'Onboarding', items:[['welcome','Accueil'],['intro','Présentation'],['setcode','Code parent']] },
  { epic:'Profils enfants', items:[['home','Qui brille ?'],['create','Créer un profil'],['routine','Routine proposée'],['kids','Mes enfants']] },
  { epic:'Ma semaine', items:[['week-lea','Léa · détaillée'],['week-noah','Noah · simplifiée']] },
  { epic:'Tâches & comportements', items:[['tasks','Horaire'],['form','Bibliothèque']] },
  { epic:'Attribution des étoiles', items:[['parent','Demandes'],['give','Donner une étoile'],['pin','Accès parent']] },
];
function currentKey() { return state.screen === 'week' ? 'week-' + state.currentKid : state.screen; }
function panelGo(key) {
  if (key.startsWith('week-')) { const id = key.slice(5); if (!getKid(id)) return toast('Réinitialisez la démo pour retrouver ce profil'); return go('week', { kid:id }); }
  if (key === 'setcode') { state.onboarding = true; state.codeMode = 'onboard'; state.codeStep = 1; state.codeEntry = ''; state.codeFirst = ''; state.codeMsg = ''; }
  if (key === 'intro') state.introIdx = 0;
  if (key === 'pin') { state.pinTarget = 'parent'; state.pinTargetOpts = {}; state.pin = ''; state.pinError = ''; state.unlocked = false; }
  if (key === 'routine' && !(state.routineKid && state.routineDraft && getKid(state.routineKid))) { toast('Créez d’abord un profil : la routine est proposée juste après'); return go('create'); }
  go(key);
}
function renderPanel() {
  const cur = currentKey();
  const col = groups => groups.map(g => `
    <div>
      <p class="text-[10px] uppercase tracking-[.14em] text-slate-400 font-extrabold mb-1.5">${g.epic}</p>
      <div class="grid gap-1">${g.items.map(([k, l]) => `<button onclick="panelGo('${k}')" class="tap w-full h-8 px-3 rounded-lg text-[13px] font-bold flex items-center justify-between gap-2 ${cur === k ? 'bg-accent-400 text-ink' : 'bg-slate-700/50 hover:bg-slate-700 text-slate-100'}">
        <span class="truncate">${l}</span></button>`).join('')}</div>
    </div>`).join('');
  $('panelNav').innerHTML = `<div class="space-y-3">${col(PANEL.slice(0, 2))}</div><div class="space-y-3">${col(PANEL.slice(2))}</div>`;
  $('codeHint').innerHTML = `Code parent <b class="text-slate-200">${state.parentCode}</b> · Mot de passe <b class="text-slate-200">${DEMO_PASSWORD}</b>`;
  updateLockStatus();
}

/* Relance simulée : écran de démarrage, puis ouverture en mode enfant (STAR-39), données conservées */
function reopenApp() {
  closeOverlay(); $('toast').classList.add('hidden');
  state.unlocked = false; state.onboarding = false; state.pin = ''; state.pinError = ''; state.weekView = 'day';
  $('screens').innerHTML = `<section class="absolute inset-0 bg-primary-900 flex flex-col items-center justify-center text-white">
    <div class="pop">${mascot(120)}</div><p class="font-display text-3xl mt-6">Petite Étoile</p></section>`;
  $('statusbar').classList.add('text-white'); $('statusbar').classList.remove('text-ink');
  setTimeout(() => go('home'), 900);
}
function resetDemo() { closeOverlay(); state = seed(); go('welcome'); toast('🔄 Démo réinitialisée'); }

/* =========================================================
   MISE À L'ÉCHELLE : téléphone + panneau tiennent toujours dans l'écran
   ========================================================= */
function fitLayout() {
  const wrap = $('phoneWrap'), phone = $('phone'), pw = $('panelWrap'), panel = $('panel');
  const availH = window.innerHeight - 48, availW = window.innerWidth - 48 - 40;
  panel.style.transform = ''; pw.style.height = ''; pw.style.width = '';
  const ph = panel.offsetHeight, pwid = panel.offsetWidth;
  let s = Math.min(1, availH / 826), ps = Math.min(1, availH / ph);
  const need = 389 * s + pwid * ps;
  if (need > availW) { const k = availW / need; s *= k; ps *= k; }   // aucune barre de défilement, même sur un petit écran
  phone.style.transformOrigin = 'top left'; phone.style.transform = s < 1 ? `scale(${s})` : '';
  wrap.style.width = 389 * s + 'px'; wrap.style.height = 826 * s + 'px';
  panel.style.transformOrigin = 'top left'; panel.style.transform = ps < 1 ? `scale(${ps})` : '';
  pw.style.width = pwid * ps + 'px'; pw.style.height = ph * ps + 'px';
}
window.addEventListener('resize', fitLayout);
go('welcome');
fitLayout();
</script>
